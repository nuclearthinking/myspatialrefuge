- version: '1.18'
  date: January 2026
  status: released
  added:
  - New upgrade "Sanctuary Healing" - wounds heal faster while resting in your refuge. Up to 2x healing speed at max level
    (5 levels)
  - New upgrade "Restful Slumber" - sleeping in your refuge is more restorative. Up to 2x fatigue recovery at max level (5
    levels)
  - New upgrade "Inner Peace" - your refuge becomes a sanctuary for your mind. Boredom, stress, and unhappiness fade much
    faster. Up to 4x mental recovery at max level (5 levels)
  - New upgrade "Muscle Recovery" - stiffness and soreness from exercise fade faster while in your refuge. Up to 2.5x stiffness
    recovery at max level (5 levels)
  - New upgrade "Refuge Basement" - dig out a basement level beneath your refuge. Requires maxed "Expand Refuge" upgrade first
  - Experience Essence system now has sandbox settings - you can disable the system entirely or adjust the base XP retention
    percentage
